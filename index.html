<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>The Cube</title>
		<meta
			name="viewport"
			content="width=device-width,height=device-height,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0" />
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<div class="ui">
			<div class="ui__background"></div>

			<div class="ui__game"></div>

			<div class="ui__texts">
				<h1 class="text text--title">
					<span>THE</span>
					<span>CUBE</span>
				</h1>
				<div class="text text--note">Double tap to start</div>
				<div class="text text--timer">0:00</div>
				<div class="text text--complete">
					<span>Complete!</span>
				</div>
				<div class="text text--best-time">
					<icon trophy></icon>
					<span>Best Time!</span>
				</div>
			</div>

			<div class="ui__prefs">
				<range name="size" title="Cube Size" list="2,3,4,5"></range>
				<range
					name="flip"
					title="Flip Type"
					list="Swift&nbsp;,Smooth,Bounce"></range>
				<range name="scramble" title="Scramble Length" list="20,25,30"></range>
				<range
					name="fov"
					title="Camera Angle"
					list="Ortographic,Perspective"></range>
				<range
					name="theme"
					title="Color Scheme"
					list="Cube,Erno,Dust,Camo,Rain"></range>
			</div>

			<div class="ui__theme">
				<range name="hue" title="Hue" color></range>
				<range name="saturation" title="Saturation" color></range>
				<range name="lightness" title="Lightness" color></range>
			</div>

			<div class="ui__stats">
				<div class="stats" name="cube-size"><i>Cube:</i><b>3x3x3</b></div>
				<div class="stats" name="total-solves">
					<i>Total solves:</i><b>-</b>
				</div>
				<div class="stats" name="best-time"><i>Best time:</i><b>-</b></div>
				<div class="stats" name="worst-time"><i>Worst time:</i><b>-</b></div>
				<div class="stats" name="average-5"><i>Average of 5:</i><b>-</b></div>
				<div class="stats" name="average-12"><i>Average of 12:</i><b>-</b></div>
				<div class="stats" name="average-25"><i>Average of 25:</i><b>-</b></div>
			</div>

			<div class="ui__buttons">
				<button class="btn btn--bl btn--stats">
					<icon trophy></icon>
				</button>
				<button class="btn btn--br btn--prefs">
					<icon settings></icon>
				</button>
				<button class="btn btn--bl btn--back">
					<icon back></icon>
				</button>
				<button class="btn btn--br btn--theme">
					<icon theme></icon>
				</button>
				<button class="btn btn--br btn--reset">
					<icon reset></icon>
				</button>
			</div>

			<button
				class="hands__toggle"
				title="Realistic Mode: webcam hand tracking (H)"
				aria-label="Toggle Realistic Mode"
				hidden>
				<icon hand></icon>
				<span>Hands</span>
			</button>

			<div class="hands" hidden>
				<div class="hands__preview">
					<video class="hands__video" playsinline muted></video>
					<canvas class="hands__overlay" width="240" height="180"></canvas>
				</div>
				<div class="hands__status" role="status" aria-live="polite">Pinch a sticker and drag.</div>
				<label class="hands__tune">
					<span class="hands__tune-head">
						<span>Turn sensitivity</span>
						<b class="hands__sensitivity-value">1.15×</b>
					</span>
					<input
						class="hands__sensitivity"
						type="range"
						min="0.6"
						max="2"
						step="0.05"
						value="1.15"
						aria-label="Turn sensitivity" />
				</label>
			</div>

			<div class="hand-cursor" hidden>
				<span class="hand-cursor__label"></span>
			</div>
		</div>
		<script src="./js/three.min.js"></script>
		<script src="./vendor/mediapipe/vision_bundle.js"></script>
		<script src="./js/animation.js"></script>
		<script src="./js/world.js"></script>
		<script src="./js/geometry.js"></script>
		<script src="./js/cube.js"></script>
		<script src="./js/easing.js"></script>
		<script src="./js/tween.js"></script>
		<script src="./js/draggable.js"></script>
		<script src="./js/controls.js"></script>
		<script src="./js/hand-tracking.js"></script>
		<script src="./js/realistic-mode.js"></script>
		<script src="./js/scrambler.js"></script>
		<script src="./js/transition.js"></script>
		<script src="./js/timer.js"></script>
		<script src="./js/range.js"></script>
		<script src="./js/preferences.js"></script>
		<script src="./js/confetti.js"></script>
		<script src="./js/scores.js"></script>
		<script src="./js/storage.js"></script>
		<script src="./js/themes.js"></script>
		<script src="./js/theme-editor.js"></script>
		<script src="./js/states.js"></script>
		<script src="./js/icons.js"></script>
		<script src="./js/game.js"></script>
		<script src="./js/main.js"></script>
	</body>
</html>
